server:
  port: ${PORT}
spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:auth-service/.env[.properties]
  application:
    name: auth-service
  datasource:
    url: ${db_url}
    username: ${db_username}
    password: ${db_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${google_client_id}
            client-secret: ${google_client_secret}
            scope: profile,email
eureka:
  client:
    service-url:
      defaultZone: ${eureka_url}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME}
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS}
    non-secure-port-enabled: ${EUREKA_NON_SECURE_PORT_ENABLED}
    secure-port-enabled: ${EUREKA_SECURE_PORT_ENABLED}
    secure-port: ${EUREKA_SECURE_PORT}
jwt:
  secret: ${jwt_secret}
  expiration: ${jwt_expiration}
