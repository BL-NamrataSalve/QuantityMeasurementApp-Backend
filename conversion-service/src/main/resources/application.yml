server:
  port: ${PORT:8082}
spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:conversion-service/.env[.properties]
  application:
    name: conversion-service
  datasource:
    url: ${db_url}
    username: ${db_username}
    password: ${db_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
eureka:
  client:
    service-url:
      defaultZone: ${eureka_url}
jwt:
  secret: ${jwt_secret}
  expiration: 86400000
