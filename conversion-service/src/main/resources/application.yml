server:
  port: ${PORT:8082}
spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:conversion-service/.env[.properties]
  application:
    name: conversion-service
  datasource:
    url: ${db_url}
    username: ${db_username}
    password: ${db_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
eureka:
  client:
    service-url:
      defaultZone: ${eureka_url}
  instance:
    lease-renewal-interval-in-seconds: 5
    hostname: ${EUREKA_INSTANCE_HOSTNAME}
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS}
    non-secure-port-enabled: ${EUREKA_NON_SECURE_PORT_ENABLED}
    secure-port-enabled: ${EUREKA_SECURE_PORT_ENABLED}
    secure-port: ${EUREKA_SECURE_PORT}
jwt:
  secret: ${jwt_secret}
  expiration: ${jwt_expiration:86400000}
